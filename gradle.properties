# ---- Gradle ----
# 本机系统默认编码是 GBK，而源码含中文注释。必须显式指定 UTF-8，
# 否则 javac 会按 GBK 解析 UTF-8 源文件导致乱码或编译报错。
# 加 -Duser.language=en：本机默认 locale 是中文，在 GBK 控制台下 javac 的中文报错会乱码
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true

# 本机默认 JAVA_HOME 是 JDK 1.8，不满足 1.20.1 要求。
# 这里局部覆盖，不改动全局环境变量。
org.gradle.java.home=C:/Users/HiddenSummer/.jdks/jbr-17.0.7

# ---- 模组元数据 ----
mod_id=apothinfuser
mod_name=Apothic Arcana
mod_name_zh=神化：奥术秘法
mod_license=MIT
mod_version=1.0.1
mod_group_id=com.apothinfuser
mod_authors=HiddenSummer
mod_description=A pair of arcane enchanting tables that put Apotheosis' four-dimensional enchanting stats under the player's control: the Arcane Enchanting Table, which keeps the vanilla-style table and its randomized offers but lets you dial Eterna, Quanta and Arcana freely within what the bookshelves provide, and the Ultimate Arcane Enchanting Table, built on Enchanting Infuser, which adds full per-enchantment selection, level editing and infusion recipes.

# ---- 平台 ----
minecraft_version=1.20.1
# 注意：Apotheosis 仓库 gradle.properties 里写的 47.1.106 在 Forge maven 上并不存在
# （47.1.x 实际最高只到 47.1.47），Apotheosis 自身也不声明 forge 依赖。
# 唯一约束来自 enchantinginfuser 的 mods.toml：forge >= 47.1.0。
# 用 47.4.23：1.20.1 上最新的 Forge 构建（已实测可用）。
forge_version=47.4.23
parchment_version=2023.07.16-1.20.1
# enchantinginfuser 本体声明的 FML 下限（见其 mods.toml）
min_forge_version=47.1.0

# ---- 依赖版本（取自 Modrinth maven，均已核验存在）----
# enchanting-infuser 8.0.3 的 mods.toml 声明 puzzleslib >= 8.1.13
enchanting_infuser_version=v8.0.3-1.20.1-Forge
puzzles_lib_version=v8.1.13-1.20.1-Forge
apotheosis_version=7.4.8
placebo_version=8.6.3
apothic_attributes_version=1.3.7

# 注意：puzzles-lib 通过 Jar-in-Jar 内嵌 puzzlesaccessapi（新版还有 mixinextras）。
# ForgeGradle dev 环境不会自动展开嵌套 jar，必须提取到 libs/ 目录。
# 运行 `gradlew extractJiJ` 可在切换 puzzles_lib_version 后重新提取。

# 神化软依赖（仅 dev 运行时，用于游戏内指南书）
patchouli_version=1.20.1-85-forge

# 仅 dev 运行时：JEI（查灌注配方需求，神化只支持 JEI）
jei_version=15.62.0.216

# ---- Jade 兼容（编译期，运行期软依赖）----
# Jade 的主分发在 CurseForge——实测 Modrinth maven 上没有它的元数据（整条路径 404），
# 所以走 cursemaven。这里用 fileId 而不是版本号是 CurseForge 的坐标格式要求。
#
# 这个 fileId 与**神化 7.4.8 编译时用的那个完全相同**（取自神化自己的 gradle.properties
# 里 jadeFileId=4986594），实测对应 Jade 11.7.1 for 1.20.1 Forge。
# 刻意不挑更新的版本：我们要照搬的就是神化那套插件写法，用同一版编译能保证
# 它调用的 API 与神化所见一致，不会因 Jade 版本漂移而出现"神化能跑我们不能跑"。
jade_file_id=4986594
