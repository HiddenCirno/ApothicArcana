modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    authors="${mod_authors}"
    description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Enchanting Infuser 是**可选联动**：装了才有终极奥术附魔台，不装时本模组其余内容照常工作。
# 我们 Mixin 进 InfuserMenu 的私有构造器，因此仍限定在 8.0.x 区间——
# 若灌注台在 8.1 改动该签名，Mixin 会失配，联动层的启动自检会直接报错。
# puzzleslib 不在此声明：我们代码不直接引用它，灌注台自己的 mods.toml 会负责它。
[[dependencies.${mod_id}]]
    modId="enchantinginfuser"
    mandatory=false
    versionRange="[8.0.3,8.1)"
    ordering="AFTER"
    side="BOTH"

# 我们调用 ApothEnchantmentMenu.gatherStats / EnchModule.getEnchInfo
# 以及 EnchantingRecipe.findMatch，全部来自神化附魔模块。
[[dependencies.${mod_id}]]
    modId="apotheosis"
    mandatory=true
    versionRange="[7.4.8,8.0)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="placebo"
    mandatory=true
    versionRange="[8.6.2,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="attributeslib"
    mandatory=true
    versionRange="[1.3.5,)"
    ordering="NONE"
    side="BOTH"
